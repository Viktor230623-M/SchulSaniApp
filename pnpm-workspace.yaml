# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - ops/e2e
  - scripts

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.0
  zod: ^3.25.76

autoInstallPeers: false

# pnpm 11 liest die erlaubten Postinstall-Builds aus allowBuilds (vorher
# onlyBuiltDependencies). Ohne esbuild-Build fehlt das esbuild-Binary und
# `pnpm install` bricht mit ERR_PNPM_IGNORED_BUILDS ab.
allowBuilds:
  '@swc/core': true
  esbuild: true
  msw: true
  react-native-libsodium: true
  unrs-resolver: true

overrides:
  # Plattenform-Binaries (esbuild, lightningcss, rollup, oxide, ngrok) werden
  # nicht mehr weggepined: der Workspace laeuft auf macOS, Linux und Windows,
  # jeweils x64 und arm64. Auf jeder Maschine installiert pnpm nur das zum
  # jeweiligen Betriebssystem passende Binary.
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
  # Patched versions for vulnerable transitive deps of express (GHSA advisories: qs DoS, path-to-regexp ReDoS)
  "qs@>=6.11.1 <6.15.2": "^6.15.2"
  "path-to-regexp@>=8.0.0 <8.4.0": "^8.4.0"
  # Patched versions for vulnerable transitive deps of the expo toolchain (all within-major bumps)
  "shell-quote@<1.9.0": "^1.9.0"
  "fast-uri@>=3 <3.1.2": "^3.1.2"
  "node-forge@<1.4.0": "^1.4.0"
  "picomatch@>=2 <2.3.2": "^2.3.2"
  "picomatch@>=3 <3.0.2": "^3.0.2"
  "picomatch@>=4 <4.0.4": "^4.0.4"
  "@xmldom/xmldom@>=0.8.0 <0.8.13": "^0.8.13"
  "brace-expansion@<1.1.18": "^1.1.18"
  "brace-expansion@>=2 <2.1.4": "^2.1.4"
  "brace-expansion@>=5 <5.0.9": "^5.0.9"
  "postcss@>=8 <8.5.23": "^8.5.23"
  "ws@>=6 <6.2.4": "^6.2.4"
  "ws@>=7 <7.5.11": "^7.5.11"
  "ws@>=8 <8.20.1": "^8.20.1"
  "yaml@>=1 <1.10.3": "^1.10.3"
  "yaml@>=2 <2.8.3": "^2.8.3"
  "uuid@<11.1.1": "^11.1.1"
  "tar@<7.5.21": "^7.5.21"
  "undici@<6.28.0": "^6.28.0"
  "js-yaml@<4": "^3.15.1"
  "js-yaml@>=4 <4.3.1": "^4.3.1"
  "nanoid@<3.3.18": "^3.3.18"
  "@babel/core@<7.29.6": "^7.29.6"
  "body-parser@>=2 <2.3.0": "^2.3.0"
