# Von install.sh gerendert (<DIST_PATH>, <BACKEND_PORT>) und nach
# /etc/nginx/schulsani/locations.conf kopiert. Wird vom Server-Block und vom
# TLS-Block fuer benutzerdefinierte Ports eingebunden.

root <DIST_PATH>;
index index.html;

client_max_body_size 10m;

location / {
    try_files $uri $uri/ /index.html;
}

location /api/ {
    proxy_pass http://127.0.0.1:<BACKEND_PORT>/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}
